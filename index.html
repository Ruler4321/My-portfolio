<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOWE // GloweAPI</title>
    <style>
        body { background: #060913; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        header { border-bottom: 2px solid #00f3ff; padding: 10px; font-size: 20px; font-weight: bold; color: #00f3ff; }
        .card { background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; max-width: 400px; margin: 40px auto; text-align: left; }
        .hidden { display: none !important; }
        h2 { color: #00f3ff; margin-top: 0; font-size: 18px; }
        input { background: #060913; border: 1px solid #1e293b; padding: 10px; border-radius: 4px; color: #fff; width: 100%; box-sizing: border-box; margin: 10px 0; outline: none; }
        input:focus { border-color: #00f3ff; }
        .btn { background: linear-gradient(135deg, #00f3ff, #0055ff); border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; color: #8892b0; cursor: pointer; text-decoration: underline; }
        .error { color: #ff3333; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <header>GLOWE // GloweAPI v1.0</header>

    <!-- ЭКРАН 1: ВХОД -->
    <div class="card" id="box-login">
        <h2>Вход в терминал</h2>
        <input type="text" id="log-user" placeholder="Никнейм">
        <input type="password" id="log-pass" placeholder="Пароль">
        <button class="btn" onclick="alert('GloweAPI: Успешный вход!')">Войти</button>
        <div class="link" onclick="toggleScreen(0)">Впервые на GLOWE? Создать аккаунт</div>
    </div>

    <!-- ЭКРАН 2: РЕГИСТРАЦИЯ (@YA.RU) -->
    <div class="card hidden" id="box-reg">
        <h2>Регистрация (Только @ya.ru)</h2>
        <input type="email" id="reg-mail" placeholder="логин@ya.ru" oninput="checkMail()">
        <div id="mail-err" class="error hidden">🚨 Допустим только домен @ya.ru!</div>
        <button class="btn" id="btn-code" style="background:#ff007f;color:#fff;" onclick="sendCode()">Получить код</button>
        
        <div id="code-group" class="hidden">
            <input type="text" id="reg-code" placeholder="XXXX" maxlength="4" style="text-align:center;font-size:18px;">
            <button class="btn" style="background:#33ff33;color:#000;" onclick="doneReg()">Создать аккаунт</button>
        </div>
        <div class="link" onclick="toggleScreen(1)">Уже есть аккаунт? Войти</div>
    </div>

    <script>
        function toggleScreen(toLogin) {
            document.getElementById('box-login').classList.toggle('hidden', !toLogin);
            document.getElementById('box-reg').classList.toggle('hidden', toLogin);
        }

        function checkMail() {
            let m = document.getElementById('reg-mail').value;
            let err = document.getElementById('mail-err');
            let btn = document.getElementById('btn-code');
            let ok = m === "" || m.endsWith('@ya.ru');
            err.classList.toggle('hidden', ok);
            btn.disabled = !ok;
            btn.style.opacity = ok ? "1" : "0.3";
        }

        function sendCode() {
            alert('GloweAPI: Код отправлен на сервер Яндекса!');
            document.getElementById('code-group').classList.remove('hidden');
        }

        function doneReg() {
            if(document.getElementById('reg-code').value.length === 4) {
                alert('Аккаунт занесен в базу GloweAPI!');
                toggleScreen(1);
            } else { alert('Неверный код!'); }
        }

        // ДИНАМИЧЕСКИЙ СКРИПТ ОЧИСТКИ ССЫЛОК С ПРОБЕЛАМИ
        let badUrl = "https://jsdelivr.net  /npm/  @emailjs/  browser@4  /dist/  email.min.js";
        let script = document.createElement("script");
        script.src = badUrl.replace(/ /g, "");
        document.body.appendChild(script);

        // ПЕРЕХВАТ НИКА ИЗ URL
        window.onload = function() {
            let user = new URLSearchParams(window.location.search).get('user');
            if (user) document.getElementById('log-user').value = user;
        };
    </script>

</body>
</html>
