<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOWE Terminal</title>
    <style>
        body { background: #0e0e0e; color: #00ff00; font-family: monospace; padding: 15px; }
        .hidden { display: none; }
        input, button { background: #1a1a1a; color: #00ff00; border: 1px solid #00ff00; padding: 6px; margin: 4px 0; width: 100%; max-width: 280px; font-family: monospace; box-sizing: border-box; }
        button { cursor: pointer; width: auto; background: #003300; }
        .log { height: 180px; overflow-y: auto; background: #000; border: 1px solid #222; padding: 8px; margin: 8px 0; max-width: 450px; }
        .btn-num { color: #ffaa00; border-color: #ffaa00; margin: 2px; padding: 5px 10px; }
        .btn-col { margin: 2px; padding: 5px 8px; color: #000; font-weight: bold; border-color: #fff; }
        .blind { filter: grayscale(100%) contrast(130%); color: #fff!important; }
        .blind input, .blind button { color: #fff!important; border-color: #fff!important; background: #222!important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>GLOWE // Вход</h2>
        <input type="text" id="user-id" placeholder="ID пользователя">
        <input type="password" id="user-password" placeholder="Пароль">
        <button onclick="checkAccess()">Войти</button>
    </div>

    <div id="menu-screen" class="hidden">
        <h2>🎛️ ВЫБОР СПЕЦИАЛИЗАЦИИ:</h2>
        <button onclick="selectRole('mute')" style="color:#ffaa00;border-color:#ffaa00">🔇 НЕМОЙ НАБЛЮДАТЕЛЬ</button><br><br>
        <button onclick="selectRole('blind')" style="color:#00ffff;border-color:#00ffff">🕶️ СЛЕПОЙ ИСПОЛНИТЕЛЬ</button>
    </div>

    <div id="terminal-screen" class="hidden">
        <h2>💻 <span id="role-title"></span></h2>
        <div class="log" id="term-log"></div>
        
        <div id="text-zone" class="hidden">
            <input type="text" id="msg-input" placeholder="Написать..." onkeydown="if(event.key==='Enter') transmit()">
            <button onclick="transmit()">Отправить</button>
        </div>

        <div id="mute-zone" class="hidden">
            <p>Цифры: 
                <button class="btn-num" onclick="sendSig('1')">1</button>
                <button class="btn-num" onclick="sendSig('2')">2</button>
                <button class="btn-num" onclick="sendSig('3')">3</button>
                <button class="btn-num" onclick="sendSig('4')">4</button>
                <button class="btn-num" onclick="sendSig('5')">5</button>
            </p>
            <p>Цвета: 
                <button class="btn-col" style="background:#ff3333" onclick="sendSig('🔴 КРАСНЫЙ')">Кр</button>
                <button class="btn-col" style="background:#33ff33" onclick="sendSig('🟢 ЗЕЛЕНЫЙ')">Зл</button>
                <button class="btn-col" style="background:#ffff33" onclick="sendSig('🟡 ЖЕЛТЫЙ')">Жл</button>
                <button class="btn-col" style="background:#3333ff;color:#fff" onclick="sendSig('🔵 СИНИЙ')">Сн</button>
            </p>
        </div>
        <br>
        <button onclick="generateLink()">Ссылка гостя (24ч)</button>
        <p id="link-out" style="color:#ffff00;word-break:break-all;font-size:12px;max-width:450px;"></p>
    </div>

    <script>
        let isAdmin = true, accountId = "", chosenRole = "";

        function checkAccess() {
            const id = document.getElementById('user-id').value.trim();
            const pass = document.getElementById('user-password').value;
            if (!id || !pass) return;
            accountId = id;
            isAdmin = !(new URLSearchParams(window.location.search)).get('token');
            document.getElementById('login-screen').classList.add('hidden');
            if (isAdmin) { chosenRole = "admin"; launch(); } 
            else { document.getElementById('menu-screen').classList.remove('hidden'); }
        }

        function selectRole(role) {
            chosenRole = role;
            document.getElementById('menu-screen').classList.add('hidden');
            if (role === 'blind') document.body.classList.add('blind');
            launch();
        }

        function launch() {
            document.getElementById('terminal-screen').classList.remove('hidden');
            const title = document.getElementById('role-title');
            if (chosenRole === 'admin') {
                title.innerText = "Глухой Передатчик (Создатель)";
                document.getElementById('text-zone').classList.remove('hidden');
            } else if (chosenRole === 'mute') {
                title.innerText = "Немой Наблюдатель";
                document.getElementById('mute-zone').classList.remove('hidden');
            } else if (chosenRole === 'blind') {
                title.innerText = "Слепой Исполнитель";
                document.getElementById('text-zone').classList.remove('hidden');
            }
            updateLog(); setInterval(updateLog, 1000);
        }

        function updateLog() {
            if (!accountId) return;
            const history = JSON.parse(localStorage.getItem('glowe_chat_' + accountId)) || [];
            const log = document.getElementById('term-log');
            let html = "";
            history.forEach(d => {
                if (chosenRole==='admin' || d.fromAdmin || d.role==='🕶️ СЛЕПОЙ' || d.role==='🔇 НЕМОЙ') {
                    html += `<div>[${d.role}]: ${d.text}</div>`;
                }
            });
            if (log.innerHTML !== html) { log.innerHTML = html; log.scrollTop = log.scrollHeight; }
        }

        function transmit() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim() || !accountId) return;
            const history = JSON.parse(localStorage.getItem('glowe_chat_' + accountId)) || [];
            history.push({ text: input.value, role: chosenRole==='admin' ? "🔥 СОЗДАТЕЛЬ" : "🕶️ СЛЕПОЙ", fromAdmin: chosenRole==='admin' });
            localStorage.setItem('glowe_chat_' + accountId, JSON.stringify(history));
            input.value = ""; updateLog();
        }

        function sendSig(txt) {
            if (!accountId) return;
            const history = JSON.parse(localStorage.getItem('glowe_chat_' + accountId)) || [];
            history.push({ text: `🔀 Знак -> ${txt}`, role: "🔇 НЕМОЙ", fromAdmin: false });
            localStorage.setItem('glowe_chat_' + accountId, JSON.stringify(history));
            updateLog();
        }

        function generateLink() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-password').value;
            const ts = Math.floor(Date.now() / 1000);
            const token = Math.random().toString(36).substring(2, 10);
            document.getElementById('link-out').innerText = "Ссылка: " + window.location.origin + window.location.pathname + `?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}&ts=${ts}&token=${token}`;
        }

        window.onload = function() {
            const p = new URLSearchParams(window.location.search);
            if (p.get('id') && p.get('pass')) {
                document.getElementById('user-id').value = decodeURIComponent(p.get('id'));
                document.getElementById('user-password').value = decodeURIComponent(p.get('pass'));
                checkAccess();
            }
        };
    </script>
</body>
</html>
