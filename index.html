<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GLOWE</title><style>
body{background:#0e0e0e;color:#00ff00;font-family:monospace;padding:15px}.h{display:none}input,button{background:#1a1a1a;color:#00ff00;border:1px solid #00ff00;padding:6px;margin:4px 0;width:100%;max-width:280px;font-family:monospace;box-sizing:border-box}button{cursor:pointer;width:auto;background:#003300}.log{height:140px;overflow-y:auto;background:#000;border:1px solid #222;padding:8px;margin:8px 0;max-width:450px}.n{color:#ffaa00;border-color:#ffaa00;margin:2px;padding:5px 10px}.c{margin:2px;padding:5px 8px;color:#000;font-weight:bold;border-color:#fff}.p{border:1px dashed #fff;padding:10px;margin-top:10px;max-width:450px;background:#111}.r{border-color:#ffaa00;color:#ffaa00;font-size:12px}.b{filter:grayscale(100%) contrast(130%);color:#fff!important}.b input,.b button{color:#fff!important;border-color:#fff!important;background:#222!important}.l{font-size:14px;font-weight:bold;padding:8px;border:1px solid #00ff00;margin-bottom:8px;max-width:450px;background:#050505}.t{color:#ff3333;font-size:17px;font-weight:bold}
</style></head><body>
<div id="d1"><h2>GLOWE // Вход</h2><input id="u" placeholder="ID"><input id="p" type="password" placeholder="Пароль"><button onclick="ch()">Войти</button></div>
<div id="d2" class="h"><h2>🎛️ ЛВЛ 1: РОЛЬ</h2><button onclick="sr('mute')" style="color:#ffaa00;border-color:#ffaa00">MUTE</button><br><br><button onclick="sr('blind')" style="color:#00ffff;border-color:#00ffff">BLIND</button></div>
<div id="d3" class="h" style="border:2px solid #00ff00;padding:20px;background:#001100;max-width:450px"><h1>🎉 ВЫГРАЛИ! 🎉</h1><button onclick="nl()" style="background:#005500;padding:10px">ДАЛЬШЕ (УРОВЕНЬ 2)</button></div>
<div id="d4" class="h"><h2>💻 <span id="r"></span> <span id="v" style="color:#ffff00"></span></h2><div class="t">⏱️ ТАЙМЕР: <span id="tm">05:00</span></div>
<div id="z1" class="h"><div class="l">🚨 УЛИКА: <span id="lm"></span></div></div><div id="z2" class="h" style="color:#ffff00;font-weight:bold">🔑 ШИФР (ДЛЯ НЕМОГО): <span id="sf"></span></div><div class="log" id="lg"></div>
<div id="z3" class="h"><input id="in" placeholder="Написать..." onkeydown="if(event.key==='Enter') tx()"><button onclick="tx()">Отправить</button></div>
<div id="z4" class="h"><p>Цифры: <button class="n" onclick="ss('1')">1</button><button class="n" onclick="ss('2')">2</button><button class="n" onclick="ss('3')">3</button><button class="n" onclick="ss('4')">4</button><button class="n" onclick="ss('5')">5</button><button class="n" onclick="ss('6')">6</button><button class="n" onclick="ss('7')">7</button><button class="n" onclick="ss('8')">8</button><button class="n" onclick="ss('9')">9</button><button class="n" onclick="ss('0')">0</button></p>
<p id="mc">Цвета: <button class="c" style="background:#ff3333" onclick="ss('🔴 КР')">Кр</button><button class="c" style="background:#33ff33" onclick="ss('🟢 ЗЛ')">Зл</button><button class="c" style="background:#ffff33" onclick="ss('🟡 ЖЛ')">Жл</button><button class="c" style="background:#3333ff;color:#fff" onclick="ss('🔵 СН')">Сн</button></p>
<div class="p r" id="rb"><h3>📖 ТАБЛИЦА СБОЯ:</h3>• Кр+3=777 | • Зл+1=102<br>• Жл+5=940 | • Сн+2=404</div></div>
<div id="z5" class="h"><div class="p"><h3>🔒 ШКАТУЛКА</h3><p id="bs">ЗАБЛОКИРОВАНО</p><input id="vc" placeholder="Код" style="max-width:120px;"><button onclick="uv()">Вскрыть</button></div></div><br><button onclick="gl()">Ссылка (24ч)</button><p id="lo" style="color:#ffff00;word-break:break-all;font-size:12px;max-width:450px"></p></div>
<script>
let ad=1,ak="",rl="",lv=1,tk=null;
function ch(){let id=document.getElementById("u").value.trim(),ps=document.getElementById("p").value;if(!id||!ps)return;ak=id;ad=!(new URLSearchParams(window.location.search)).get("token");document.getElementById("d1").classList.add("h");lv=parseInt(localStorage.getItem("g_l_"+ak))||1;if(ad){rl="admin";if(!localStorage.getItem("g_t_"+ak))localStorage.setItem("g_t_"+ak,Math.floor(Date.now()/1000)+300);ln();}else{if(lv===1)document.getElementById("d2").classList.remove("h");else{rl=['mute','blind'][(new URLSearchParams(window.location.search)).get("token").charCodeAt(0)%2];ln();}}}
function sr(r){rl=r;document.getElementById("d2").classList.add("h");ln();}
function ln(){if(rl==="blind")document.body.classList.add("b");document.getElementById("d4").classList.remove("h");document.getElementById("v").innerText=`(LVL ${lv})`;let t=document.getElementById("r");if(rl==="admin"){t.innerText="Глухой Передатчик";document.getElementById("z3").classList.remove("h");if(lv===1){document.getElementById("z1").classList.remove("h");glp();}}else if(rl==="mute"){t.innerText="Немой Наблюдатель";if(lv===2){document.getElementById("mc").classList.add("h");document.getElementById("rb").innerHTML="<h3>📖 СБОЙ ЛВЛ 2:</h3>Примите код от Слепого и введите его кнопками!";}document.getElementById("z4").classList.remove("h");}else if(rl==="blind"){t.innerText="Слепой Исполнитель";document.getElementById("z3").classList.remove("h");document.getElementById("z5").classList.remove("h");if(lv===2){if(!localStorage.getItem("g_v_"+ak))localStorage.setItem("g_v_"+ak,Math.floor(100+Math.random()*900));document.getElementById("z2").classList.remove("h");document.getElementById("sf").innerText=localStorage.getItem("g_v_"+ak);}}clearInterval(tk);tk=setInterval(loop,1000);}
function loop(){up();let rem=(parseInt(localStorage.getItem("g_t_"+ak))||0)-Math.floor(Date.now()/1000);if(localStorage.getItem("g_w_"+ak)==="true"){clearInterval(tk);document.getElementById("d4").classList.add("h");document.getElementById("d3").classList.remove("h");return;}if(rem<=0){clearInterval(tk);document.getElementById("tm").innerText="00:00";document.getElementById("lg").innerHTML="<h1 style='color:red'>💥 БОМБА ВЗОРВАНА!</h1>";document.getElementById("z3").classList.add("h");document.getElementById("z4").classList.add("h");document.getElementById("z5").classList.add("h");}else{document.getElementById("tm").innerText=`${Math.floor(rem/60).toString().padStart(2,"0")}:${(rem%60).toString().padStart(2,"0")}`;}if((parseInt(localStorage.getItem("g_l_"+ak))||1)!==lv)location.reload();}
function glp(){const m=[{t:"🔴 КР + 3",c:"#ff3333"},{t:"🟢 ЗЛ + 1",c:"#33ff33"},{t:"🟡 ЖЛ + 5",c:"#ffff3 yellow"},{t:"🔵 СН + 2",c:"#3333ff"}],s=m[Math.floor((Date.now()/60000)%m.length)];document.getElementById("lamp-status")?document.getElementById("lamp-status").innerText=s.t:document.getElementById("lm").innerText=s.t;document.getElementById("lm").style.color=s.c;}
function up(){if(!ak)return;const h=JSON.parse(localStorage.getItem("g_c_"+ak))||[],l=document.getElementById("lg");let html="";h.forEach(d=>{if(lv===2&&d.role==="🕶️ СЛЕПОЙ"&&rl==="blind")html+=`<div>[${d.role}]: ${d.text}</div>`;else if(rl==="admin"||d.fa||d.role==="⚙️ СИС"||d.role==="🔇 НЕМОЙ"||(lv===2&&rl==="mute"&&d.role==="🕶️ СЛЕПОЙ"))html+=`<div>[${d.role}]: ${d.text}</div>`;});if(l.innerHTML!==html){l.innerHTML=html;l.scrollTop=l.scrollHeight;}}
function tx(){const i=document.getElementById("msg-input")||document.getElementById("in");if(!i.value.trim()||!ak)return;const h=JSON.parse(localStorage.getItem("g_c_"+ak))||[];h.push({text:i.value,role:rl==="admin"?"🔥 СОЗД":"🕶️ СЛЕПОЙ",fa:rl==="admin"});localStorage.setItem("g_c_"+ak,JSON.stringify(h));i.value="";up();}
function ss(t){if(!ak)return;const h=JSON.parse(localStorage.getItem("g_c_"+ak))||[];h.push({text:`🔀 Знак -> ${t}`,role:"🔇 НЕМОЙ",fa:0});localStorage.setItem("g_c_"+ak,JSON.stringify(h));up();}
function uv(){const c=document.getElementById("vault-code")||document.getElementById("vc"),v=c.value.trim();if((lv===1&&["777","102","940","404"].includes(v))||(lv===2&&v===localStorage.getItem("g_v_"+ak))){localStorage.setItem("g_w_"+ak,"true");}else{alert("❌ СБОЙ!");}c.value="";}
function nl(){localStorage.setItem("g_l_"+ak,2);localStorage.setItem("g_w_"+ak,"false");localStorage.setItem("g_t_"+ak,Math.floor(Date.now()/1000)+300);localStorage.removeItem("g_v_"+ak);location.reload();}
function gl(){const id=document.getElementById("u").value,p=document.getElementById("p").value,ts=Math.floor(Date.now()/1000),t=Math.random().toString(36).substring(2,10);document.getElementById("lo").innerText="Ссылка: "+window.location.origin+window.location.pathname+`?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(p)}&ts=${ts}&token=${t}`;}
window.onload=function(){const p=new URLSearchParams(window.location.search);if(p.get("id")&&p.get("pass")){document.getElementById("u").value=decodeURIComponent(p.get("id"));document.getElementById("p").value=decodeURIComponent(p.get("pass"));ch();}};
</script></body></html>
