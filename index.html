<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOWE Terminal</title>
    <style>
        body { background: #0e0e0e; color: #00ff00; font-family: monospace; padding: 20px; }
        .hidden { display: none; }
        input, button { background: #1a1a1a; color: #00ff00; border: 1px solid #00ff00; padding: 8px; margin: 5px 0; width: 100%; max-width: 300px; font-family: monospace; box-sizing: border-box; }
        button { cursor: pointer; width: auto; background: #003300; }
        .log { height: 200px; overflow-y: auto; background: #000; border: 1px solid #222; padding: 10px; margin: 10px 0; max-width: 500px; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <h2>GLOWE // Вход</h2>
        <input type="text" id="user-id" placeholder="ID пользователя">
        <input type="password" id="user-password" placeholder="Пароль">
        <button onclick="checkAccess()">Войти</button>
    </div>

    <!-- ЭКРАН ТЕРМИНАЛА -->
    <div id="terminal-screen" class="hidden">
        <h2>💻 Терминал: <span id="role-title"></span></h2>
        <div class="log" id="term-log"></div>
        <input type="text" id="msg-input" placeholder="Написать что угодно..." onkeydown="if(event.key==='Enter') transmit()">
        <button onclick="transmit()">Отправить</button>
        <br><br>
        <button onclick="generateLink()">Создать ссылку гостя (24ч)</button>
        <p id="link-out" style="color: #ffff00; word-break: break-all; max-width: 500px;"></p>
    </div>

    <script>
        let isAdmin = true, channel = "";

        async function checkAccess() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-password').value;
            if (!id || !pass) return;

            const urlParams = new URLSearchParams(window.location.search);
            // Если зашли по ссылке с токеном — значит зашел Гость
            isAdmin = !urlParams.get('token'); 
            
            // Превращаем ID в уникальную секретную комнату связи
            const buffer = new TextEncoder().encode("chan_" + id);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            channel = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('terminal-screen').classList.remove('hidden');
            document.getElementById('role-title').innerText = isAdmin ? "Главный Создатель" : "Гость";

            // Слушаем входящие сообщения из сети
            const es = new EventSource(`https://sse.dev{channel}/listen`);
            es.onmessage = function(e) {
                const data = JSON.parse(e.data);
                // Главный видит всё. Гости видят сообщения ТОЛЬКО от Главного.
                if (isAdmin || data.fromAdmin) {
                    const log = document.getElementById('term-log');
                    log.innerHTML += `<div>[${data.role}]: ${data.text}</div>`;
                    log.scrollTop = log.scrollHeight;
                }
            };
        }

        async function transmit() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim()) return;

            await fetch(`https://sse.dev{channel}/publish`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: input.value,
                    role: isAdmin ? "🔥 СОЗДАТЕЛЬ" : "👤 ГОСТЬ",
                    fromAdmin: isAdmin
                })
            });
            input.value = "";
        }

        async function generateLink() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-password').value;
            const ts = Math.floor(Date.now() / 1000);
            
            // Быстрый хэш для токена
            const buf = new TextEncoder().encode(`${id}_${pass}_${ts}`);
            const hBuf = await crypto.subtle.digest('SHA-256', buf);
            const token = Array.from(new Uint8Array(hBuf)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 12);

            const url = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}&ts=${ts}&token=${token}`;
            document.getElementById('link-out').innerText = "Ссылка: " + url;
        }

        // Авто-вход при переходе по ссылке
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('id') && params.get('pass')) {
                document.getElementById('user-id').value = params.get('id');
                document.getElementById('user-password').value = params.get('pass');
                checkAccess();
            }
        };
    </script>
</body>
</html>
